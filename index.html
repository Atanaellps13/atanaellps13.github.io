<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NoelZinn Scott</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;800&family=Mr+Dafoe&display=swap" rel="stylesheet">
<style>
:root{--neon:#6fd6ff;--ink:#eaf6ff;--muted:#9fc3dc}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;color:var(--ink);
  background:linear-gradient(160deg,#0e2233,#1d4a6b);
  overflow:hidden;
}
.bg{position:fixed;inset:0;background:url("banner.jpg") center/cover no-repeat;
  opacity:.18;filter:blur(8px);transform:scale(1.05)}
main{position:relative;height:100%;display:grid;place-items:center;
  padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
.frame{
  position:relative;width:min(760px,100%);
  border:1.5px solid var(--neon);border-radius:6px;
  box-shadow:0 0 22px rgba(111,214,255,.35),inset 0 0 28px rgba(111,214,255,.08);
  background:rgba(10,30,48,.5);
  padding:clamp(28px,6vw,60px);
  display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;
}
.avatar{
  width:clamp(110px,24vw,170px);aspect-ratio:1;border-radius:50%;
  border:2px solid var(--neon);box-shadow:0 0 18px rgba(111,214,255,.5);
  background:url("banner.jpg") 50% 22%/260% no-repeat,#1d4a6b;
}
.name{position:relative}
h1{
  font-weight:800;font-size:clamp(3.4rem,15vw,7rem);line-height:.9;
  background:linear-gradient(180deg,#8fd0ff 20%,#4f9be8 90%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(111,214,255,.35));
}
.script{
  font-family:"Mr Dafoe","Brush Script MT",cursive;
  font-size:clamp(2.2rem,9vw,4rem);line-height:1;
  position:absolute;right:-2%;bottom:-.7em;
  color:#fff;text-shadow:0 0 12px rgba(111,214,255,.7);transform:rotate(-4deg);
}
.status{margin-top:22px;color:var(--muted);font-weight:500;font-size:clamp(1.1rem,3.5vw,1.4rem);letter-spacing:.03em}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<main>
  <section class="frame">
    <div class="avatar" role="img" aria-label="Foto de perfil do NoelZinn"></div>
    <div class="name">
      <h1>NoelZinn</h1>
      <span class="script">Scott</span>
    </div>
    <p class="status">🚧 em construção</p>
  </section>
</main>
</body>
</html>
